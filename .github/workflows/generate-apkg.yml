name: Generate Japanese Anki APKG

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Generate a small audio sample or the complete deck
        required: true
        type: choice
        default: sample
        options:
          - sample
          - full
      sample_size:
        description: Number of cards when mode is sample
        required: true
        type: string
        default: "8"
  pull_request:
    paths:
      - "data/**"
      - "templates/**"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/generate-apkg.yml"

permissions:
  contents: read

concurrency:
  group: japanese-wordbook-audio-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-wordlist:
    runs-on: ubuntu-latest
    outputs:
      has_wordlist: ${{ steps.detect.outputs.has_wordlist }}
      card_count: ${{ steps.metadata.outputs.card_count }}
      media_count: ${{ steps.metadata.outputs.media_count }}
      shard_count: ${{ steps.metadata.outputs.shard_count }}
      shards: ${{ steps.metadata.outputs.shards }}
      artifact_name: ${{ steps.metadata.outputs.artifact_name }}
      output_filename: ${{ steps.metadata.outputs.output_filename }}
    steps:
      - uses: actions/checkout@v7
      - name: Detect temporary build data
        id: detect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ -f data/deck-config.json && -f data/wordlist.json && -f data/corrections.json ]]; then
            echo "has_wordlist=true" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "Temporary build data is absent. Add deck-config.json, wordlist.json, and corrections.json under data/ before manually starting this workflow." >&2
            exit 1
          else
            echo "has_wordlist=false" >> "$GITHUB_OUTPUT"
            echo "Repository contains no wordlist data; skipping sample generation for this cleanup change."
          fi
      - name: Read dynamic build metadata
        id: metadata
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          config_path = Path("data/deck-config.json")
          if config_path.is_file():
              config = json.loads(config_path.read_text(encoding="utf-8"))
              card_count = int(config["expected_total"])
              shard_count = min(16, card_count)
              values = {
                  "card_count": card_count,
                  "media_count": card_count * 3,
                  "shard_count": shard_count,
                  "shards": json.dumps(list(range(shard_count)), separators=(",", ":")),
                  "artifact_name": config["artifact_name"],
                  "output_filename": config["output_filename"],
              }
          else:
              values = {
                  "card_count": 0,
                  "media_count": 0,
                  "shard_count": 1,
                  "shards": "[0]",
                  "artifact_name": "wordbook-apkg",
                  "output_filename": "wordbook.apkg",
              }
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              for key, value in values.items():
                  handle.write(f"{key}={value}\n")
          PY
      - uses: actions/setup-python@v7
        if: ${{ steps.detect.outputs.has_wordlist == 'true' }}
        with:
          python-version: "3.12"
      - name: Validate wordlist
        if: ${{ steps.detect.outputs.has_wordlist == 'true' }}
        run: python scripts/validate_wordlist.py

  generate-audio:
    needs: validate-wordlist
    if: ${{ needs.validate-wordlist.outputs.has_wordlist == 'true' }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: ${{ fromJSON(needs.validate-wordlist.outputs.shards) }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Plan shard
        id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_MODE: ${{ inputs.mode }}
          REQUESTED_SAMPLE_SIZE: ${{ inputs.sample_size }}
          SHARD: ${{ matrix.shard }}
          SHARD_COUNT: ${{ needs.validate-wordlist.outputs.shard_count }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            mode="sample"
            sample_size="4"
          else
            mode="${REQUESTED_MODE:-sample}"
            sample_size="${REQUESTED_SAMPLE_SIZE:-8}"
          fi
          if ! [[ "$sample_size" =~ ^[0-9]+$ ]] || (( sample_size < 1 || sample_size > 100 )); then
            echo "sample_size must be an integer from 1 through 100" >&2
            exit 1
          fi
          if [[ "$mode" == "full" ]]; then
            should_run="true"
            output_dir="build/audio-shard-${SHARD}"
            artifact_name="audio-shard-$(printf '%02d' "$SHARD")"
            arguments="--shard-index $SHARD --shard-count $SHARD_COUNT"
          else
            if [[ "$SHARD" == "0" ]]; then should_run="true"; else should_run="false"; fi
            output_dir="build/audio-sample"
            artifact_name="audio-sample"
            arguments="--shard-index 0 --shard-count 1 --limit $sample_size"
          fi
          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "sample_size=$sample_size" >> "$GITHUB_OUTPUT"
          echo "output_dir=$output_dir" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "arguments=$arguments" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: ${{ steps.plan.outputs.should_run == 'true' }}
      - uses: actions/setup-python@v7
        if: ${{ steps.plan.outputs.should_run == 'true' }}
        with:
          python-version: "3.12"
          cache: pip
      - name: Install FFmpeg and Python dependencies
        if: ${{ steps.plan.outputs.should_run == 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Restore completed audio shard
        if: ${{ steps.plan.outputs.should_run == 'true' }}
        uses: actions/cache@v6
        with:
          path: ${{ steps.plan.outputs.output_dir }}
          key: japanese-wordbook-edge-${{ hashFiles('data/deck-config.json', 'data/wordlist.json') }}-${{ steps.plan.outputs.mode }}-${{ matrix.shard }}-${{ steps.plan.outputs.sample_size }}
      - name: Generate audio
        if: ${{ steps.plan.outputs.should_run == 'true' }}
        run: >-
          python scripts/generate_audio.py
          --config data/deck-config.json
          --input data/wordlist.json
          --output-dir "${{ steps.plan.outputs.output_dir }}"
          ${{ steps.plan.outputs.arguments }}
          --concurrency 1
          --retries 5
      - name: Validate every MP3
        if: ${{ steps.plan.outputs.should_run == 'true' }}
        run: >-
          python scripts/validate_audio.py
          --config data/deck-config.json
          --input data/wordlist.json
          --audio-dir "${{ steps.plan.outputs.output_dir }}"
          ${{ steps.plan.outputs.arguments }}
          --workers 8
      - name: Upload audio shard
        if: ${{ steps.plan.outputs.should_run == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.plan.outputs.artifact_name }}
          path: ${{ steps.plan.outputs.output_dir }}
          retention-days: 14
          compression-level: 0
          if-no-files-found: error

  build-package:
    needs: [validate-wordlist, generate-audio]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'full' && needs.validate-wordlist.outputs.has_wordlist == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Download all audio shards
        uses: actions/download-artifact@v8
        with:
          pattern: audio-shard-*
          path: build/full-audio
          merge-multiple: true
      - name: Check the complete media set
        shell: bash
        env:
          EXPECTED_MEDIA: ${{ needs.validate-wordlist.outputs.media_count }}
          EXPECTED_MANIFESTS: ${{ needs.validate-wordlist.outputs.shard_count }}
        run: |
          test "$(find build/full-audio -type f -name '*.mp3' | wc -l | tr -d ' ')" = "$EXPECTED_MEDIA"
          test "$(find build/full-audio -type f -name 'audio_manifest_shard_*.json' | wc -l | tr -d ' ')" = "$EXPECTED_MANIFESTS"
      - name: Build complete APKG
        run: >-
          python scripts/build_apkg.py
          --config data/deck-config.json
          --input data/wordlist.json
          --audio-dir build/full-audio
      - name: Validate complete APKG
        env:
          OUTPUT_FILENAME: ${{ needs.validate-wordlist.outputs.output_filename }}
        run: python scripts/validate_apkg.py --config data/deck-config.json --input data/wordlist.json "dist/${OUTPUT_FILENAME}"
      - name: Preserve rebuild identity with the package
        run: cp data/deck-config.json dist/deck-config.json
      - name: Upload complete APKG and configuration
        uses: actions/upload-artifact@v7
        with:
          name: ${{ needs.validate-wordlist.outputs.artifact_name }}
          path: |
            dist/${{ needs.validate-wordlist.outputs.output_filename }}
            dist/deck-config.json
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
