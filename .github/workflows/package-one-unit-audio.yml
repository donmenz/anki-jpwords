name: Package One N3 Unit Audio
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download N3 audio shards and source list
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/audio" "$RUNNER_TEMP/source"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/31292640276/artifacts" --jq '.artifacts[] | select(.expired == false and (.name | startswith("n3-audio-shard-"))) | [.id,.name] | @tsv' | while IFS=$'\t' read -r id name; do
            gh api -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/actions/artifacts/$id/zip" > "$RUNNER_TEMP/artifact.zip"
            unzip -q -o "$RUNNER_TEMP/artifact.zip" -d "$RUNNER_TEMP/audio"
          done
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/agent/full-n3-audio-workflow/data/n3/wordlist.json" -o "$RUNNER_TEMP/source/wordlist.json"
          python - "$RUNNER_TEMP/source/wordlist.json" "$RUNNER_TEMP/audio" <<'PY'
          import json,pathlib,sys
          source,audio=map(pathlib.Path,sys.argv[1:])
          rows=[r for r in json.loads(source.read_text()) if str(r.get('unit'))=='1']
          if not rows: raise SystemExit('unit 1 not found')
          with (audio/'concat.txt').open('w') as f:
            for r in rows:
              for suffix in ('word_x2','sentence_x2'):
                p=audio/f"{r['id']}_{suffix}.mp3"
                if not p.exists(): raise SystemExit(f'missing {p}')
                f.write(f"file '{p}'\n")
          print(f'N3 unit 1: {len(rows)} cards')
          PY
      - name: Build and validate N3 unit 1 MP3
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          ffmpeg -hide_banner -loglevel error -f concat -safe 0 -i "$RUNNER_TEMP/audio/concat.txt" -c:a libmp3lame -b:a 96k -ar 24000 -ac 1 "$GITHUB_WORKSPACE/N3-第1单元-单词2遍例句2遍.mp3"
          ffprobe -v error -show_entries format=duration -of default=nw=1 "$GITHUB_WORKSPACE/N3-第1单元-单词2遍例句2遍.mp3"
      - uses: actions/upload-artifact@v4
        with:
          name: N3-unit-1-audio
          path: N3-第1单元-单词2遍例句2遍.mp3
          retention-days: 30
